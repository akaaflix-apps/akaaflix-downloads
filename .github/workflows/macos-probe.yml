name: macOS probe (temporary)
on:
  push:
    branches: [ "claude/admiring-johnson-5a5f2o" ]
    paths: [ ".github/workflows/macos-probe.yml" ]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ macos-14, macos-15, macos-15-intel, macos-26 ]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: System
        run: |
          sw_vers; uname -m; sysctl -n machdep.cpu.brand_string || true
          xcodebuild -version; xcode-select -p
          ls /Applications | grep -i xcode || true
          swift --version
      - name: VLCKit layout
        if: matrix.runner == 'macos-15'
        run: |
          curl -fsSL -o vlckit.tar.xz https://download.videolan.org/pub/cocoapods/prod/VLCKit-3.7.3-319ed2c0-79128878.tar.xz
          shasum -a 256 vlckit.tar.xz
          mkdir v && tar -xJf vlckit.tar.xz -C v
          find v -maxdepth 4 | head -50
          fw=$(find v -name VLCKit.framework -path '*macos*' | head -1); echo "fw=$fw"
          lipo -info "$fw/VLCKit" || lipo -info "$fw/Versions/A/VLCKit"
          otool -l "$fw/Versions/A/VLCKit" | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN' | head -20
          ls "$fw/Versions/A/Headers" | head -60
          grep -n "videoAspectRatio\|currentVideoSubTitleDelay\|saveVideoSnapshotAt\|addPlaybackSlave\|initWithVideoView\|initWithOptions\|audioTrackNames\|videoSubTitlesNames\|jumpForward\|@property.*drawable\|hasVideoOut\|videoSize\|@property.*rate\|@property.*position\|@property.*time\|remainingTime\|isSeekable\|seekable\|@property.*state" "$fw/Versions/A/Headers/VLCMediaPlayer.h" | head -80
          grep -n "volume\|muted\|Muted" "$fw/Versions/A/Headers/VLCAudio.h" | head
          grep -n "initWithURL\|addOption\|@property.*length\|mediaWithURL" "$fw/Versions/A/Headers/VLCMedia.h" | head
          grep -n "intValue\|@property" "$fw/Versions/A/Headers/VLCTime.h" | head
          grep -n "interface\|@property" "$fw/Versions/A/Headers/VLCVideoView.h" | head
          grep -n "sharedLibrary\|version\|@property" "$fw/Versions/A/Headers/VLCLibrary.h" | head -20
          grep -n "typedef NS_ENUM\|VLCMediaPlayerState" "$fw/Versions/A/Headers/VLCMediaPlayer.h" | head -20
          sed -n '/typedef NS_ENUM(NSInteger, VLCMediaPlayerState)/,/};/p' "$fw/Versions/A/Headers/VLCMediaPlayer.h"
          sed -n '/@protocol VLCMediaPlayerDelegate/,/@end/p' "$fw/Versions/A/Headers/VLCMediaPlayer.h"
          grep -n "NS_ASSUME_NONNULL\|nullable" "$fw/Versions/A/Headers/VLCMediaPlayer.h" | head -5
          cat v/*/COPYING.txt 2>/dev/null | head -5 || true
          ls -la v/*/ || true
