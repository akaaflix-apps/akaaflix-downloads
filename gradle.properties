org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# Renewal / support contact shown on the Account screen ("Renew subscription").
# Leave empty to show the generic "contact your provider" message.
# These are NOT secrets; override them in ~/.gradle/gradle.properties if needed.
# ---------------------------------------------------------------------------
akaaflix.support.whatsapp=
akaaflix.support.email=
akaaflix.support.url=

# Release signing is configured ONLY from external properties, e.g. in
# ~/.gradle/gradle.properties or with -P on the command line:
#   AKAAFLIX_KEYSTORE_FILE, AKAAFLIX_KEYSTORE_PASSWORD,
#   AKAAFLIX_KEY_ALIAS, AKAAFLIX_KEY_PASSWORD
# Never commit keystores or passwords to this repository.
