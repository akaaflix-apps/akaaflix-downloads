org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# Update checking (Settings -> About -> Check for updates).
# The launcher only contacts GitHub when the user presses "Check for updates".
# Releases are matched by tag prefix so the same repository can host other apps.
# ---------------------------------------------------------------------------
akaa.update.repo=akaaflix-apps/akaaflix-downloads
akaa.update.tagPrefix=launcher-v

# Weather uses Open-Meteo (no API key). The free endpoint is for non-commercial use;
# set akaa.weather.apiKey (customer API) for commercial distribution.
akaa.weather.apiKey=

# Release signing is configured ONLY from external properties (never commit keys):
#   AKAAFLIX_LAUNCHER_KEYSTORE_FILE, AKAAFLIX_LAUNCHER_KEYSTORE_PASSWORD,
#   AKAAFLIX_LAUNCHER_KEY_ALIAS, AKAAFLIX_LAUNCHER_KEY_PASSWORD
